; Estação de clima + qualidade do ar + repetidor Wi-Fi (ESP32-S3 + LCD 20x4 I2C)
; Gravar e abrir a serial: pio run -t upload -t monitor

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi   ; PSRAM octal (o "R8" da N16R8)
build_flags =
    -DBOARD_HAS_PSRAM
extra_scripts = pre:../tools/pio_usb_attach.py   ; attach automático no WSL antes de upload/monitor
lib_deps =
    duinoWitchery/hd44780@^1.3.2   ; LCD de caracteres HD44780 com adaptador I2C (PCF8574)
    bblanchon/ArduinoJson@^7
